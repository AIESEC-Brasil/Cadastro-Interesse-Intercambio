name: Sincronizar backend com repositório Back
run-name: "Sincronizar Back | ${{ github.event.head_commit.message || github.event_name }}"

on:
  push:
    branches: [main, dev]
    paths:
      - 'backend/**'
      - '.github/workflows/sync-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-backend-to-back-repository-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  sync:
    name: Publicar backend na branch ${{ github.ref_name }} do repositório Back
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório Cadastro
        uses: actions/checkout@v7

      - name: Baixar repositório Back
        uses: actions/checkout@v7
        with:
          repository: AIESEC-Brasil/Back-Cadastro-Interesse-Intercambio
          ref: main
          path: back-repository
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - name: Preparar branch correspondente no Back
        run: |
          TARGET_BRANCH="$GITHUB_REF_NAME"
          if [ "$TARGET_BRANCH" = "main" ]; then
            git -C back-repository pull --ff-only origin main
          elif git -C back-repository ls-remote --exit-code --heads origin "$TARGET_BRANCH" >/dev/null; then
            git -C back-repository fetch origin "$TARGET_BRANCH"
            git -C back-repository checkout -B "$TARGET_BRANCH" FETCH_HEAD
            git -C back-repository pull --ff-only origin "$TARGET_BRANCH"
          else
            git -C back-repository checkout -b "$TARGET_BRANCH" origin/main
          fi

      - name: Sincronizar arquivos do backend
        run: |
          rsync -a --delete --itemize-changes --exclude='/Dockerfile' --exclude='.git' --exclude='.github/' --include='.env.example' --exclude='.env*' backend/ back-repository/
          git -C back-repository rm -f --ignore-unmatch -- Dockerfile
          rm -f back-repository/Dockerfile
          mkdir -p back-repository/.github/workflows
          cp backend/.github/workflows/deploy.yml back-repository/.github/workflows/deploy.yml
          mkdir -p back-repository/.github/scripts
          cp -a backend/.github/scripts/. back-repository/.github/scripts/
          git -C back-repository config user.name 'github-actions[bot]'
          git -C back-repository config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C back-repository add --all
          if git -C back-repository diff --cached --quiet; then
            echo 'O repositório Back já está atualizado.'
            git -C back-repository push origin "HEAD:$GITHUB_REF_NAME"
            exit 0
          fi
          CHANGED_FILES="$(git -C back-repository diff --cached --name-only)"
          FILE_COUNT="$(printf '%s\n' "$CHANGED_FILES" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$FILE_COUNT" -eq 1 ]; then
            COMMIT_SUBJECT="sync(backend): atualiza ${CHANGED_FILES}"
          else
            COMMIT_SUBJECT="sync(backend): atualiza ${FILE_COUNT} arquivos"
          fi
          git -C back-repository commit -m "$COMMIT_SUBJECT" -m "Arquivos sincronizados:" -m "$CHANGED_FILES"
          git -C back-repository push origin "HEAD:$GITHUB_REF_NAME"
