name: Sincronizar backend com repositório Back
run-name: "Sincronizar Back | ${{ github.event.head_commit.message || github.event_name }}"

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/sync-backend.yml'
      - '!backend/Dockerfile'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-backend-to-back-repository
  cancel-in-progress: false

jobs:
  sync:
    name: Publicar backend no repositório separado
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório Cadastro
        uses: actions/checkout@v7

      - name: Baixar repositório Back
        uses: actions/checkout@v7
        with:
          repository: AIESEC-Brasil/Back-Cadastro-Interesse-Intercambio
          ref: main
          path: back-repository
          token: ${{ secrets.BACKEND_REPO_TOKEN }}

      - name: Sincronizar arquivos do backend
        run: |
          rsync -a --delete --exclude='.git' --exclude='.github/' --include='.env.example' --exclude='.env*' backend/ back-repository/
          mkdir -p back-repository/.github/workflows
          cp backend/.github/workflows/deploy.yml back-repository/.github/workflows/deploy.yml
          git -C back-repository config user.name 'github-actions[bot]'
          git -C back-repository config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C back-repository add --all
          if git -C back-repository diff --cached --quiet; then
            echo 'O repositório Back já está atualizado.'
            exit 0
          fi
          CHANGED_FILES="$(git -C back-repository diff --cached --name-only)"
          FILE_COUNT="$(printf '%s\n' "$CHANGED_FILES" | awk 'NF { count++ } END { print count + 0 }')"
          if [ "$FILE_COUNT" -eq 1 ]; then
            COMMIT_SUBJECT="sync(backend): atualiza ${CHANGED_FILES}"
          else
            COMMIT_SUBJECT="sync(backend): atualiza ${FILE_COUNT} arquivos"
          fi
          git -C back-repository commit -m "$COMMIT_SUBJECT" -m "Arquivos sincronizados:" -m "$CHANGED_FILES"
          git -C back-repository push origin HEAD:main
