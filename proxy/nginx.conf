# Bloco básico obrigatório (gerencia conexões)
events {
  # Define até 1024 conexões simultâneas por processo worker
  worker_connections 1024;

  # Permite aceitar múltiplas conexões de uma vez (melhora resposta sob carga)
  multi_accept on;
}

http {
  charset utf-8;

  # Define um "pool" de servidores backend
  upstream backend_upstream {
    server backend:5000;      # Nome do container + porta interna
    keepalive 32;             # Mantém até 32 conexões abertas (melhora performance)
  }

  # Define o frontend como upstream também
  upstream frontend_upstream {
    server frontend:3000;     # Servidor Next.js no container
  }

  # =========================================================
  # BLOCKER / CATCH-ALL (Servidor Padrão)
  # Captura acessos via IP direto ou domínios não autorizados
  # e encerra a conexão imediatamente sem responder nada.
  # =========================================================
  server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    return 444;               # Fecha a conexão sem enviar cabeçalhos
  }

  # =========================================================
  # SERVIDOR OFICIAL DO PROJETO
  # Responde APENAS quando a requisição for para o domínio correto
  # =========================================================
  server {
    listen 80;                # Nginx escuta na porta 80 (HTTP)
    listen [::]:80;
    server_name aiesec-brasil.local www.aiesec-brasil.local 192.168.1.17 localhost;

    # ========================
    # FRONTEND (página web)
    # ========================
    location / {
      proxy_pass http://frontend_upstream;
      # Preserva o caminho para servir páginas e arquivos estáticos do frontend

      proxy_set_header Host $host;
      # Mantém o host original da requisição (ex: aiesec-brasil.local)

      proxy_set_header X-Real-IP $remote_addr;
      # Envia o IP real do cliente para o frontend

      proxy_http_version 1.1;
      # Usa HTTP/1.1 (necessário para keep-alive funcionar)

      proxy_set_header Connection "";
      # Remove header de conexão para permitir reutilização (keep-alive)
    }

    # ========================
    # BACKEND (API)
    # ========================
    location /api/ {
      proxy_pass http://backend_upstream/;
      # IMPORTANTE:
      # O "/" no final remove o prefixo "/api/"
      # Ex: /api/users → vira /users no backend

      proxy_set_header Host $host;
      # Mantém o host original

      proxy_set_header X-Real-IP $remote_addr;
      # Envia IP real do cliente

      proxy_http_version 1.1;
      # Necessário para conexões persistentes

      proxy_set_header Connection "";
      # Permite reutilizar conexões (melhora performance)

      proxy_buffering off;
      # Desativa buffering → resposta vem mais rápida (bom para APIs)
    }

    location /openapi.json {
      proxy_pass http://backend_upstream/openapi.json;
      # Encaminha requisição para o backend (documentação da API)

      proxy_set_header Host $host;
      # Mantém o host original

      proxy_set_header X-Real-IP $remote_addr;
      # Envia IP real do cliente

      proxy_http_version 1.1;
      # Necessário para conexões persistentes

      proxy_set_header Connection "";
      # Permite reutilizar conexões (melhora performance)

      proxy_buffering off;
      # Desativa buffering → resposta vem mais rápida (bom para APIs)
    }
  }
}